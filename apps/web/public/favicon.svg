<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KnowVeris">
  <!--
    KnowVeris mark: a page (the indexed document) carrying a "K", with the
    accent dot standing for the citation every answer must carry. Drawn on a
    filled tile so it stays legible at 16px in both light and dark browser UI.
  -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <path
    d="M20 14h16l10 10v26a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V16a2 2 0 0 1 2-2Z"
    fill="#f8fafc"
  />
  <path d="M36 14l10 10H38a2 2 0 0 1-2-2V14Z" fill="#cbd5e1" />
  <path
    d="M25 26v14M25 33l7-7M25 33l8 7"
    stroke="#0f172a"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <circle cx="44" cy="42" r="4.5" fill="#38bdf8" />
</svg>
