# Golden set — bootstrap corpus (5 synthetic AML/CFT docs, FR/EN/AR).
#
# This is the DETERMINISTIC bootstrap golden set used to measure the pipeline on
# committed synthetic documents. The larger ~35-question demo golden set (FATF /
# ACPR public docs) is authored later, once corpus/demo/ is collected (PLAN §6,
# §7). Question strings and expected substrings are intentionally multilingual
# and must not be translated.
#
# Types (PLAN §6): factual · multi_hop · negative · acronym · cross_lingual.
# expected_sources match on `document` (filename); pages/sections are recorded
# for reference and stricter future metrics. expected_answer_contains is in the
# language of the question (case-insensitive substring), used by generation eval.

# ---------- factual (answer lives in a single chunk) ----------
- id: fr-seuil-factual-001
  question: "Quel est le seuil réglementaire pour une opération occasionnelle ?"
  lang: fr
  category: cdd
  type: factual
  expected_sources:
    - document: "fr-obligations-vigilance.pdf"
      pages: [1]
  expected_answer_contains: ["15 000"]
  must_refuse: false

- id: en-retention-factual-002
  question: "How long must identification and transaction records be kept?"
  lang: en
  category: recordkeeping
  type: factual
  expected_sources:
    - document: "en-customer-due-diligence.docx"
      sections: ["4. Record Keeping"]
  expected_answer_contains: ["five years"]
  must_refuse: false

- id: fr-tipping-factual-003
  question: "Peut-on informer le client qu'une déclaration de soupçon le concernant a été faite ?"
  lang: fr
  category: sar
  type: factual
  expected_sources:
    - document: "fr-declaration-soupcon.docx"
      sections: ["3. Confidentialité et interdiction du tipping-off"]
  expected_answer_contains: ["interdit"]
  must_refuse: false

