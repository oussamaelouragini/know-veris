# Golden set — demo corpus (FATF/GAFI 40 Recommendations, 2012, FR/EN/AR).
#
# The DEMO golden set, kept SEPARATE from the deterministic bootstrap set
# (golden_set.yaml). It is built on the real public FATF "International Standards
# on Combating Money Laundering and the Financing of Terrorism & Proliferation"
# (the 40 Recommendations), published word-for-word in French, English and Arabic
# — the ideal cross-lingual anchor (PLAN §6, §7). corpus/demo/ is gitignored, so
# this set only runs where the demo PDFs are present and indexed.
#
# Documents (filenames in corpus/demo/):
#   GAFI-2012-FR.pdf                 — 40 Recommandations (FR)
#   fatf-recommendations-2012-EN.pdf — 40 Recommendations (EN)
#   fatf-recommendations-2012-AR.pdf — 40 Recommendations (AR, same content)
#
# Type mix (PLAN §6): factual 5 · multi_hop 3 · negative 4 · acronym 2 ·
# cross_lingual 1 (= 15). Languages: ~6 FR · ~5 EN · ~4 AR.
#
# expected_sources match on `document` (filename); `pages` are best-effort
# references to the relevant Recommendation and are NOT asserted by the retrieval
# eval (which is document-level) — exact page anchoring is finalised against
# corpus/demo/MANIFEST.md when the generation/precision eval is run.
# expected_answer_contains is in the question's language (case-insensitive
# substring), used only by the generation eval. Question strings are
# intentionally multilingual and must not be translated.

# ---------- factual (answer lives in a single Recommendation) ----------
- id: demo-cdd-threshold-fr-001
  question: "À partir de quel montant une opération occasionnelle déclenche-t-elle une obligation de vigilance à l'égard de la clientèle ?"
  lang: fr
  category: cdd
  type: factual
  expected_sources:
    - document: "GAFI-2012-FR.pdf"   # R.10 — vigilance relative à la clientèle
      pages: [14]
  expected_answer_contains: ["15 000"]
  must_refuse: false

- id: demo-recordkeeping-fr-002
  question: "Pendant combien de temps les institutions financières doivent-elles conserver les documents relatifs aux transactions et aux données d'identification des clients ?"
  lang: fr
  category: recordkeeping
  type: factual
  expected_sources:
    - document: "GAFI-2012-FR.pdf"   # R.11 — Conservation des documents
      pages: [15]
  expected_answer_contains: ["cinq ans"]
  must_refuse: false

- id: demo-pep-approval-en-003
  question: "What must a financial institution obtain before establishing a business relationship with a politically exposed person?"
  lang: en
  category: cdd
  type: factual
  expected_sources:
    - document: "fatf-recommendations-2012-EN.pdf"   # R.12 — PEPs
      pages: [15, 16]
  expected_answer_contains: ["senior management"]
  must_refuse: false

- id: demo-str-report-fr-004
  question: "À qui une institution financière doit-elle déclarer ses soupçons de blanchiment de capitaux ?"
  lang: fr
  category: sar
  type: factual
  expected_sources:
    - document: "GAFI-2012-FR.pdf"   # R.20 — Déclaration des opérations suspectes
      pages: [18]
  expected_answer_contains: ["cellule de renseignement financier"]
  must_refuse: false

- id: demo-wire-threshold-en-005
  question: "What is the threshold above which wire transfers must include required originator and beneficiary information?"
  lang: en
  category: wire_transfers
  type: factual
  expected_sources:
    - document: "fatf-recommendations-2012-EN.pdf"   # R.16 — Wire transfers
      pages: [17]
  expected_answer_contains: ["1,000"]
  must_refuse: false

# ---------- acronym (banking jargon — value of hybrid search) ----------
- id: demo-pep-acronym-ar-006
