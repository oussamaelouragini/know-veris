  lang: ar
  category: cdd
  type: acronym
  expected_sources:
    - document: "fatf-recommendations-2012-AR.pdf"   # R.12 — PEPs
      pages: [15, 16]
  expected_answer_contains: ["الإدارة العليا"]
  must_refuse: false

- id: demo-rba-acronym-fr-007
  question: "Comment les pays et les institutions financières doivent-ils appliquer une approche fondée sur les risques (AFR) en matière de LBC-FT ?"
  lang: fr
  category: risk
  type: acronym
  expected_sources:
    - document: "GAFI-2012-FR.pdf"   # R.1 — Évaluation des risques & approche fondée sur les risques
      pages: [11, 12]
  expected_answer_contains: ["approche fondée sur les risques"]
  must_refuse: false

# ---------- multi_hop (requires 2+ Recommendations) ----------
- id: demo-str-tipping-multi-fr-008
  question: "Après avoir déclaré un soupçon, une institution financière peut-elle en informer son client, et bénéficie-t-elle d'une protection juridique pour cette déclaration ?"
  lang: fr
  category: sar
  type: multi_hop
  expected_sources:
    - document: "GAFI-2012-FR.pdf"   # R.20 (déclaration) + R.21 (interdiction du tipping-off + protection)
      pages: [18]
  expected_answer_contains: ["interdit"]
  must_refuse: false

- id: demo-cdd-recordkeeping-multi-en-009
