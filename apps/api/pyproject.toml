[project]
name = "knowveris-api"
version = "0.1.0"
description = "KnowVeris IA — self-hosted RAG assistant for bank employees"
# Upper bound required by Poetry's resolver.
requires-python = ">=3.11,<4.0"
dependencies = [
    # --- Web ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # --- DB ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # --- Auth: JWT validation via Keycloak JWKS ---
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    # --- Ingestion ---
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "langchain-text-splitters>=0.3.2",
    "lingua-language-detector>=2.0.2",
]

[tool.poetry]
# Application, not a distributable library: `poetry install` resolves and
# installs the dependencies above without trying to build `app` as a wheel.
# The container *is* the environment (POETRY_VIRTUALENVS_CREATE=false) and the
# source is bind-mounted at /app, so `app` is imported from the working dir.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.8.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The golden-set eval is live (needs Ollama + an indexed corpus) and slow, so it
# is excluded from the default suite. Run it explicitly: pytest tests/eval -m eval
addopts = "-m 'not eval'"
markers = [
    "eval: golden-set evaluation — live, needs Ollama and an indexed corpus",
]
